project:
  type: book
  resources:
    - animaciones/insertion-sort.html
    - animaciones/selection-sort.html
    - animaciones/mergesort.html

book:
  title: "Apuntes de programación en Rust"
  author: "Miguel A. Ortuño Pérez"
  date: today
  cover-image: portada/portada.png
  chapters:
    - index.qmd
    - 02-intro_rust.qmd
    - 03-entorno.qmd
    - 04-fundamentos.qmd
    - 05-vbles-ctes-tbasicos.qmd
    - 06-tipos_compuestos.qmd
    - 07-funciones.qmd
    - 08-control_flujo.qmd
    - 09-propiedad.qmd
    - 10-structs.qmd
    - 11-metodos.qmd
    - 12-enum.qmd
    - 13-patrones.qmd
    - 14-vectores.qmd
    - 15-string.qmd
    - 16-iteradores.qmd
    - 17-hashmap.qmd
    - 18-manejo_errores.qmd
    - 19-entrada_salida.qmd
    - 20-gestion_tiempo.qmd
    - 21-modulos.qmd
    - 22-lifetimes.qmd
    - 23-test_automaticos.qmd
    - 24-pnet.qmd
    - 25-analisis_algoritmos.qmd
    - 26-colas_prioridad.qmd
    - 27-ordenacion.qmd


lang: es-ES

language:
  title-block-author-single: "Autor"
  title-block-author-plural: "Autores"

crossref:
  chapters: true

format:
  html:
    toc: true
    number-sections: true
    code-copy: true

  pdf:
    include-in-header: templates/header.tex
    template-partials:
      - templates/before-body.tex
    documentclass: scrreprt
    classoption:
      - twoside
      - titlepage

    fontsize: 13pt

    geometry:
      - top=3.0cm
      - bottom=2.5cm
      - left=2.2cm
      - right=2.2cm

    highlight-style: tango
    linestretch: 1.05
    number-sections: true
    papersize: a4
    pdf-engine: xelatex

    toc: true
    toc-title: Índice

    lot: true
